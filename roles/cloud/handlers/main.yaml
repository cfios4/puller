- name: daemon-reload quadlets
  ansible.builtin.systemd_service:
    scope: user
    daemon_reload: true
  environment: 
    XDG_RUNTIME_DIR: "/run/user/1000"  

- name: restart forgejo
  ansible.builtin.systemd_service:
    name: forgejo
    state: restarted
    scope: user
  environment: 
    XDG_RUNTIME_DIR: "/run/user/1000"

- name: restart papra
  ansible.builtin.systemd_service:
    name: papra
    state: restarted
    scope: user
  environment: 
    XDG_RUNTIME_DIR: "/run/user/1000"

- name: restart vaultwarden
  ansible.builtin.systemd_service:
