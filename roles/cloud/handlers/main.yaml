- name: daemon-reload quadlets
  become: true
  become_user: bootc
  ansible.builtin.systemd_service:
    daemon_reload: true
    scope: user
  environment:
    XDG_RUNTIME_DIR: "/run/user/1000"

- name: restart forgejo
  become: true
  become_user: bootc
  ansible.builtin.systemd_service:
    name: forgejo
    state: restarted
    scope: user
  environment: 
    XDG_RUNTIME_DIR: "/run/user/1000"

- name: restart papra
  become: true
  become_user: bootc
  ansible.builtin.systemd_service:
    name: papra
    state: restarted
    scope: user
  environment: 
    XDG_RUNTIME_DIR: "/run/user/1000"

- name: restart vaultwarden
  become: true
  become_user: bootc
  ansible.builtin.systemd_service:
    name: vaultwarden
    state: restarted
    scope: user
  environment: 
    XDG_RUNTIME_DIR: "/run/user/1000"

