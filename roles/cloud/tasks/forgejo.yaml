---
- name: Create containers directory
  ansible.builtin.file:
    path: "{{ container_appdata_location }}/forgejo"
    state: directory
    owner: 1000
    group: 1000
    mode: '1777'

- name: Create Forgejo container
  containers.podman.podman_container:
    name: forgejo
    image: codeberg.org/forgejo/forgejo:17
    state: quadlet
    ports:
      - "3000:3000"
      - "3022:22"
    volumes:
      - "{{ container_appdata_location }}/forgejo:/data:Z"
      - "/etc/localtime:/etc/localtime:ro"
    env:
      USER_UID: 1000
      USER_GID: 1000
      FORGEJO__server__ROOT_URL: "git.{{ base_domain }}"
    quadlet_filename: forgejo
    quadlet_file_mode: '0644'
    quadlet_dir: /etc/containers/systemd/users/1000/
    labels:
      io.containers.autoupdate: registry
    restart_policy: always
    quadlet_options:
      - "Pull=newer"
      - |
        [Install]
        WantedBy=default.target
  notify: 
    - daemon-reload quadlets
    - restart forgejo

- name: Open firewall port for Forgejo
  ansible.posix.firewalld:
    port: "{{ forgejo_ports }}"
    state: enabled
    permanent: true
    immediate: true
    offline: true
  loop:
    - 3000/tcp
    - 3022/tcp
  loop_control:
    loop_var: forgejo_ports