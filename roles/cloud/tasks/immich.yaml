---
- name: Create immich containers directory
  ansible.builtin.file:
    path: "{{ container_appdata_location }}/immich/{{ app_for_data }}" # photo uploads to server/, probably mount nfs there
    state: directory
    owner: 1000
    group: 1000
    mode: '1777'
  loop:
    - database
    # - server
  loop_control:
    loop_var: app_for_data

- name: Define the Immich server NFS volume
  containers.podman.podman_volume:
    name: immich-server-nfs-mount
    state: quadlet
    quadlet_filename: immich-server-nfs-mount
    quadlet_file_mode: '0644'
    quadlet_dir: /etc/containers/systemd
    quadlet_options:
      - VolumeName=immich-server-nfs-mount
      - Type=nfs
      - Device=/var/mnt/mass/nfs/immich
      - Options=vers=3,addr=10.0.30.3,rw,hard,bg,_netdev,noauto

- name: Create pod for immich containers
  containers.podman.podman_pod:
    name: immich
    state: quadlet
    ports: 
      - "2283:2283"
    etc_hosts:
      immich-machine-learning: 127.0.0.1
    quadlet_filename: immich
    quadlet_file_mode: '0644'
    quadlet_dir: /etc/containers/systemd/users/1000/
    quadlet_options:
      - |
        [Install]
        WantedBy=default.target

- name: Create Immich Database container
  containers.podman.podman_container:
    name: immich-database
    image: "ghcr.io/immich-app/postgres:{{ immich_database_version }}"
    state: quadlet
    pod: immich.pod
    volumes:
      - "{{ container_appdata_location }}/immich/database:/var/lib/postgresql/data:z"
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "{{ postgres_password }}"
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: --data-checksums
    quadlet_filename: immich-database
    quadlet_file_mode: '0644'
    quadlet_dir: /etc/containers/systemd/users/1000/
    # labels:
    #   io.containers.autoupdate: registry
    # restart_policy: always
    quadlet_options:
      - Pull=newer
      - |
        [Install]
        WantedBy=default.target
  notify: 
    - daemon-reload quadlets
    - restart immich-pod

- name: Create Immich Server container
  containers.podman.podman_container:
    name: immich-server
    image: "ghcr.io/immich-app/immich-server:{{ immich_server_version }}"
    state: quadlet
    pod: immich.pod
    volumes:
      - immich-server-nfs-mount.volume:/data #"{{ container_appdata_location }}/immich/server:/data:z"
      - "/etc/localtime:/etc/localtime:ro"
    env:
      REDIS_HOSTNAME: localhost
      DB_USERNAME: postgres
      DB_PASSWORD: "{{ postgres_password }}"
      DB_DATABASE_NAME: immich
      DB_HOSTNAME: localhost
    quadlet_filename: immich-server
    quadlet_file_mode: '0644'
    quadlet_dir: /etc/containers/systemd/users/1000/
    labels:
      io.containers.autoupdate: registry
    restart_policy: always
    quadlet_options:
      - Pull=newer
      - |
        [Unit]
        After=immich-database.service
        Requires=immich-database.service

        [Install]
        WantedBy=default.target
  notify: 
    - daemon-reload quadlets
    - restart immich-pod

- name: Create Immich Machine Learning container
  containers.podman.podman_container:
    name: immich-ml
    image: "ghcr.io/immich-app/immich-machine-learning:{{ immich_server_version }}"
    state: quadlet
    pod: immich.pod
    quadlet_filename: immich-ml
    quadlet_file_mode: '0644'
    quadlet_dir: /etc/containers/systemd/users/1000/
    labels:
      io.containers.autoupdate: registry
    restart_policy: always
    quadlet_options:
      - Pull=newer
      - |
        [Unit]
        After=immich-database.service
        Requires=immich-database.service

        [Install]
        WantedBy=default.target
  notify: 
    - daemon-reload quadlets
    - restart immich-pod

- name: Create Immich Caching container
  containers.podman.podman_container:
    name: immich-cache
    image: docker.io/valkey/valkey:9
    state: quadlet
    pod: immich.pod
    healthcheck: redis-cli ping | grep -q PONG || exit 1
    quadlet_filename: immich-cache
    quadlet_file_mode: '0644'
    quadlet_dir: /etc/containers/systemd/users/1000/
    labels:
      io.containers.autoupdate: registry
    restart_policy: always
    quadlet_options:
      - Pull=newer
      - |
        [Unit]
        After=immich-database.service
        Requires=immich-database.service

        [Install]
        WantedBy=default.target
  notify: 
    - daemon-reload quadlets
    - restart immich-pod

- name: Open firewall port for Immich
  ansible.posix.firewalld:
    port: 2283/tcp
    state: enabled
    permanent: true
    immediate: true
    offline: true