---
- name: Create containers directory
  ansible.builtin.file:
    path: "{{ container_appdata_location }}/immich/{{ app_for_data }}"
    state: directory
    owner: root
    group: root
    mode: '1777'
  loop:
    - immich-database
    - immich-server
  loop_control:
    loop_var: app_for_data

- name: Create Immich Database container
  containers.podman.podman_container:
    name: immich-database
    image: "ghcr.io/immich-app/postgres:{{ immich_database_version }}"
    state: quadlet
    pod: new:immich
    volumes:
      - "{{ container_appdata_location }}/immich/immich-database:/var/lib/postgresql/data:z"
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "{{ postgres_password }}"
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: --data-checksums
    quadlet_filename: immich-database
    quadlet_file_mode: '0644'
    quadlet_dir: /etc/containers/systemd/users/1000/
    # labels:
    #   io.containers.autoupdate: registry
    # restart_policy: always
    quadlet_options:
      - "Pull=newer"
      - |
        [Install]
        WantedBy=default.target
  notify: 
    - daemon-reload quadlets
    - restart immich-database

- name: Create Immich Caching container
  containers.podman.podman_container:
    name: immich-cache
    image: docker.io/valkey/valkey:9
    state: quadlet
    pod: immich
    healthcheck: redis-cli ping | grep -q PONG || exit 1
    quadlet_filename: immich-cache
    quadlet_file_mode: '0644'
    labels:
      io.containers.autoupdate: registry
    restart_policy: always
    quadlet_options:
      - "Pull=newer"
      - |
        [Install]
        WantedBy=default.target
  notify: 
    - daemon-reload quadlets
    - restart immich-cache

- name: Create Immich Server container
  containers.podman.podman_container:
    name: immich-server
    image: "ghcr.io/immich-app/immich-server:{{ immich_server_version }}"
    state: quadlet
    requires:
      - immich-redis.container
      - immich-database.container
    pod: immich
    ports:
      - "2283:2283"
    volumes:
      - "{{ container_appdata_location }}/immich/immich-server:/data:z" # photo uploads
      - "/etc/localtime:/etc/localtime:ro"
    env:
      REDIS_HOSTNAME: localhost
      DB_USERNAME: postgres
      DB_PASSWORD: "{{ postgres_password }}"
      DB_DATABASE_NAME: immich
      DB_HOSTNAME: localhost
    quadlet_filename: immich-server
    quadlet_file_mode: '0644'
    labels:
      io.containers.autoupdate: registry
    restart_policy: always
    quadlet_options:
      - "Pull=newer"
      - |
        [Install]
        WantedBy=default.target
  notify: 
    - daemon-reload quadlets
    - restart immich-server

- name: Create Immich Machine Learning container
  containers.podman.podman_container:
    name: immich-ml
    image: "ghcr.io/immich-app/immich-machine-learning:{{ immich_server_version }}"
    state: quadlet
    pod: immich
    quadlet_filename: immich-ml
    quadlet_file_mode: '0644'
    labels:
      io.containers.autoupdate: registry
    restart_policy: always
    quadlet_options:
      - "Pull=newer"
      - |
        [Install]
        WantedBy=default.target
  notify: 
    - daemon-reload quadlets
    - restart immich-ml

- name: Open firewall port for Immich
  ansible.posix.firewalld:
    port: 2283/tcp
    state: enabled
    permanent: true
    immediate: true
    offline: true