---
- name: Create containers directory
  ansible.builtin.file:
    path: "{{ container_appdata_location }}/vaultwarden"
    state: directory
    owner: root
    group: root
    mode: '1777'

- name: Create Vaultwarden container
  containers.podman.podman_container:
    name: vaultwarden
    image: docker.io/vaultwarden/server:latest
    state: quadlet
    ports:
      - "8000:80"
    volumes:
      - "{{ container_appdata_location }}/vaultwarden:/data:Z"
    env:
      DOMAIN: "https://paper.{{ base_domain }}"
    quadlet_filename: vaultwarden
    quadlet_file_mode: '0644'
    quadlet_dir: /etc/containers/systemd/users/1000/
    labels:
      io.containers.autoupdate: registry
    restart_policy: always
    quadlet_options:
      - "Pull=newer"
      - |
        [Install]
        WantedBy=default.target
  notify: 
    - daemon-reload quadlets
    - restart vaultwarden

- name: Open firewall port for Vaultwarden
  ansible.posix.firewalld:
    port: 8000/tcp
    state: enabled
    permanent: true
    immediate: true
    offline: true