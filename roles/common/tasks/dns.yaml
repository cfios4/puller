---
- name: Create Pi-hole container
  containers.podman.podman_container:
    name: pihole
    image: docker.io/pihole/pihole:latest
    state: quadlet
    network: host
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "80:80/tcp"
      - "443:443/tcp"
      # - "67:67/udp"
      # - "123:123/udp"
    volumes:
      - "{{ container_appdata_location }}/pihole:/etc/pihole:Z"
      - "/etc/dnsmasq.d:/etc/dnsmasq.d:z"
    env:
      TZ: "{{ timezone }}"
      FTLCONF_dns_listeningMode: 'LOCAL'
      FTLCONF_dns_revServers: |
        true,10.0.20.0/24,10.0.20.1,clients.lan
        true,10.0.30.0/24,10.0.30.1,servers.lan
        true,10.0.40.0/24,10.0.40.1,iot.lan
      FTLCONF_dns_upstreams: "9.9.9.9;149.112.112.112"
    capabilities:
      - NET_ADMIN
      - SYS_TIME
      - SYS_NICE
    quadlet_filename: pihole
    quadlet_file_mode: '0644'
    quadlet_dir: /etc/containers/systemd/
    labels:
      io.containers.autoupdate: registry
    restart_policy: always
    quadlet_options:
      - "Pull=newer"
      - |
        [Install]
        WantedBy=default.target

- name: Open firewall port for PiHole
  ansible.posix.firewalld:
    port: "{{ item }}"
    state: enabled
    permanent: true
    immediate: true
    offline: true
  loop:
    - http
    - https
    - 53/tcp
    - 53/udp