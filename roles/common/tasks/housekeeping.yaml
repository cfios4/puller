---
### housekeeping ###
- name: Declare that this system is managed by bootc
  ansible.builtin.file:
    path: /etc/os-bootc
    state: touch
    mode: '0600'

- name: Symlink timezone
  ansible.builtin.file:
    src: "/usr/share/zoneinfo/{{ timezone }}"
    dest: /etc/localtime
    state: link
    force: true
    owner: root
    group: root

- name: Create containers directory
  ansible.builtin.file:
    path: "{{ container_appdata_location }}"
    state: directory
    owner: root
    group: root
    mode: '0777'

- name: Create bootc-fetch-apply-updates dropins folder
  ansible.builtin.file:
    path: /etc/systemd/system/bootc-fetch-apply-updates.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Edit bootc-fetch-apply-updates unit to remove ostree dep
  ansible.builtin.copy:
    dest: /etc/systemd/system/bootc-fetch-apply-updates.service.d/override.conf
    content: |
      [Unit]
      ConditionPathExists=
    mode: '0644'

- name: Add wheel to sudoers
  ansible.builtin.copy:
    dest: /etc/sudoers.d/wheel-nopasswd
    content: "%wheel ALL=(ALL) NOPASSWD: ALL"
    mode: '0440' 

- name: Puller cronjob
  ansible.builtin.cron:
    name: "ansible-pull job for Puller repo"
    minute: "0"
    hour: "*/4"
    day: "*"
    month: "*"
    job: >-
      echo -e "Puller cronjob has ran: $(date '+\%m-\%d-\%Y \%H:\%M:\%S')\n" > /etc/.ansible-managed &&
      ansible-pull --only-if-changed --inventory inventory.yaml --vault-password-file /root/.vault --url {{ ansible_pull_url }} {% if ansible_run_tags %}--tags {{ ansible_run_tags }}{% endif %} {% if ansible_skip_tags %}--skip-tags {{ ansible_skip_tags }}{% endif %} >> /etc/.ansible-managed

- name: Container backup cronjob
  ansible.builtin.cron:
    name: "rsync job for backing up container appdata"
    minute: "30"
    hour: "23"
    day: "*"
    month: "*"
    job: >-
      echo "Backup cronjob has ran: $(date '+%m-%d-%Y %H:%M:%S')" > /var/opt/containers/.backup.log &&
      rsync --compress --archive --update --recursive {{ item.src }} {{ item.dest }}
  loop: "{{ backup_paths }}"