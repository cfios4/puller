---
- name: daemon-reload quadlets
  become: true
  become_user: bootc
  ansible.builtin.systemd_service:
    daemon_reload: true
    scope: user
  environment:
    XDG_RUNTIME_DIR: "/run/user/1000"

- name: restart jellyfin
  become: true
  become_user: bootc
  ansible.builtin.systemd_service:
    name: jellyfin
    state: restarted
    scope: user
  environment: 
    XDG_RUNTIME_DIR: "/run/user/1000"

