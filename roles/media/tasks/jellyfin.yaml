---
- name: Create containers directory
  ansible.builtin.file:
    path: "{{ container_appdata_location }}/jellyfin"
    state: directory
    owner: root
    group: root
    mode: '1777'

- name: Create Jellyfin container
  containers.podman.podman_container:
    name: jellyfin
    image: docker.io/jellyfin/jellyfin:latest
    state: quadlet
    network: bridge
    ports:
      - "8096:8096/tcp"
    volumes:
      - "{{ container_appdata_location }}/jellyfin:/config:Z"
      - "{{ media_dir }}:/media:ro"
      - "type=tmpfs,destination=/cache"
    tmpfs:
       /cache: "rw,mode=1777"
    env:
      USER_UID: 1000
      USER_GID: 1000
    restart_policy: always
    quadlet_filename: jellyfin
    quadlet_file_mode: '0644'
    quadlet_dir: /etc/containers/systemd/users/1000/
    labels:
      io.containers.autoupdate: registry
    quadlet_options:
      - "Pull=newer"
      - |
        [Install]
        WantedBy=default.target
  notify: 
    - daemon-reload quadlets
    - restart jellyfin

- name: Open firewall port for Jellyfin
  ansible.posix.firewalld:
    port: 8096/tcp
    state: enabled
    permanent: true
    immediate: true
    offline: true