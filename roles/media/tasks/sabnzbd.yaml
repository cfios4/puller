---
- name: Create containers directory
  ansible.builtin.file:
    path: "{{ container_appdata_location }}/sabnzbd"
    state: directory
    owner: root
    group: root
    mode: '1777'

- name: "Create Sabnzbd container"
  containers.podman.podman_container:
    name: sabnzbd
    image: lscr.io/linuxserver/sabnzbd:latest
    state: quadlet
    network: bridge
    ports:
      - "8080:8080/tcp"
    volumes:
      - "{{ container_appdata_location }}/sabnzbd:/config:Z"
      - "{{ media_dir }}:/media:z"
    env:
      PUID: 0
      PGID: 0
    restart_policy: always
    quadlet_filename: sabnzbd
    quadlet_file_mode: '0644'
    quadlet_dir: /etc/containers/systemd/users/1000/
    labels:
      io.containers.autoupdate: registry
    quadlet_options:
      - "Pull=newer"
      - |
        [Install]
        WantedBy=default.target
  notify: 
    - daemon-reload quadlets
    - restart sabnzbd

- name: Open firewall port for Sabnzbd
  ansible.posix.firewalld:
    port: 8080/tcp
    state: enabled
    permanent: true
    immediate: true
    offline: true