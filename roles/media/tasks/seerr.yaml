---
- name: Create containers directory
  ansible.builtin.file:
    path: "{{ container_appdata_location }}/seerr"
    state: directory
    owner: root
    group: root
    mode: '1777'

- name: "Create Seerr container"
  containers.podman.podman_container:
    name: seerr
    image: ghcr.io/seerr-team/seerr:latest
    state: quadlet
    network: bridge
    ports:
      - "5055:5055/tcp"
    volumes:
      - "{{ container_appdata_location }}/seerr:/app/config:Z"
    tmpfs:
      /cache: "rw,mode=1777"
    env:
      PUID: 1000
      PGID: 1000
    restart_policy: always
    quadlet_filename: seerr
    quadlet_file_mode: '0644'
    quadlet_dir: /etc/containers/systemd/users/1000/
    labels:
      io.containers.autoupdate: registry
    quadlet_options:
      - "Pull=newer"
      - |
        [Install]
        WantedBy=default.target
  notify: 
    - daemon-reload quadlets
    - restart seerr

- name: Open firewall port for Seerr
  ansible.posix.firewalld:
    port: 5055/tcp
    state: enabled
    permanent: true
    immediate: true
    offline: true