---
- name: Create containers directory
  ansible.builtin.file:
    path: "{{ container_appdata_location }}/sonarr"
    state: directory
    owner: root
    group: root
    mode: '1777'

- name: "Create Sonarr container"
  containers.podman.podman_container:
    name: sonarr
    image: lscr.io/linuxserver/sonarr:latest
    state: quadlet
    network: bridge
    ports:
      - "8989:8989/tcp"
    volumes:
      - "{{ container_appdata_location }}/sonarr:/config:Z"
      - "{{ media_dir }}:/media:z"
    env:
      PUID: 0
      PGID: 0
    restart_policy: always
    quadlet_filename: sonarr
    quadlet_file_mode: '0644'
    quadlet_dir: /etc/containers/systemd/users/1000/
    labels:
      io.containers.autoupdate: registry
    quadlet_options:
      - "Pull=newer"
      - |
        [Install]
        WantedBy=default.target
  notify: daemon-reload media stack

- name: Open firewall port for Sonarr
  ansible.posix.firewalld:
    port: 8989/tcp
    state: enabled
    permanent: true
    immediate: true
    offline: true