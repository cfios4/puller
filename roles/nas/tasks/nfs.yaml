---
- name: Create NFS exports
  ansible.builtin.lineinfile:
    path: /etc/exports
    line: "{{ export }}"
    mode: "0644"
    create: true
  loop: "{{ nfs_export }}"
  loop_control:
    loop_var: export

- name: Enable NFS systemd unit
  ansible.builtin.systemd_service:
    name: "nfs-server.service"
    state: started
    enabled: true

- name: Open firewall port for NFSv3 # clients mount with nfs v3
  ansible.posix.firewalld:
    service: "{{ fw_svc }}"
    state: enabled
    permanent: true
    immediate: true
    offline: true
  loop:
    - nfs3
    - mountd
    - rpc-bind
  loop_control:
    loop_var: fw_svc